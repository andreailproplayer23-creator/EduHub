name: Aggiorna Circolari IIS Giorgi-Woolf

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: circolari-sync
  cancel-in-progress: true

jobs:
  scrape-circolari:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Esegui script circolari
        run: python scripts/scarica_circolari.py