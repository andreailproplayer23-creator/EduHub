<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduHub - Negozio XP & Customizzazione Profilo 1BI</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../js/theme.js"></script>
  <style>
    :root {
      --solid-panel: #0f172a;
      --solid-card: #162033;
      --solid-sub: #1e293b;
      --solid-border: rgba(148, 163, 184, 0.24);
    }
    html[data-theme="light"] {
      --solid-panel: #ffffff;
      --solid-card: #f8fafc;
      --solid-sub: #f1f5f9;
      --solid-border: rgba(15, 23, 42, 0.16);
    }

    .profile-showcase {
      background: var(--solid-panel);
      border: 1px solid var(--solid-border);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .showcase-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .custom-avatar-ring {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #fff;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .custom-avatar-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @keyframes rgbPulse {
      0% { border-color: #f43f5e; box-shadow: 0 0 20px rgba(244, 63, 94, 0.9); }
      33% { border-color: #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.9); }
      66% { border-color: #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.9); }
      100% { border-color: #f43f5e; box-shadow: 0 0 20px rgba(244, 63, 94, 0.9); }
    }

    /* 16 Cornici Avatar Sbloccabili */
    .frame-default { border: 3px solid #38bdf8; }
    .frame-mint { border: 3px solid #34d399; box-shadow: 0 0 14px rgba(52, 211, 153, 0.6); }
    .frame-cobalt { border: 3px solid #3b82f6; box-shadow: 0 0 16px rgba(59, 130, 246, 0.75); }
    .frame-matrix { border: 4px solid #10b981; box-shadow: 0 0 18px rgba(16, 185, 129, 0.8); }
    .frame-sunset { border: 4px solid #fb7185; box-shadow: 0 0 18px rgba(251, 113, 133, 0.8); }
    .frame-neon { border: 4px solid #ec4899; box-shadow: 0 0 20px rgba(236, 72, 153, 0.85); }
    .frame-electric { border: 4px solid #facc15; box-shadow: 0 0 20px rgba(250, 204, 21, 0.85); }
    .frame-amethyst { border: 4px solid #a855f7; box-shadow: 0 0 20px rgba(168, 85, 247, 0.85); }
    .frame-fire { border: 4px solid #f97316; box-shadow: 0 0 22px rgba(249, 115, 22, 0.9); }
    .frame-frost { border: 4px solid #7dd3fc; box-shadow: 0 0 22px rgba(125, 211, 252, 0.9); }
    .frame-bloodmoon { border: 4px solid #ef4444; box-shadow: 0 0 24px rgba(239, 68, 68, 0.95); }
    .frame-vaporwave { border: 4px solid #c084fc; box-shadow: -4px 0 18px rgba(236, 72, 153, 0.85), 4px 0 18px rgba(34, 211, 238, 0.85); }
    .frame-gold { border: 4px solid #fbbf24; box-shadow: 0 0 24px rgba(251, 191, 36, 0.9); }
    .frame-void { border: 4px solid #818cf8; box-shadow: 0 0 25px rgba(79, 70, 229, 0.95), inset 0 0 12px rgba(129, 140, 248, 0.65); }
    .frame-diamond { border: 4px solid #22d3ee; box-shadow: 0 0 26px rgba(34, 211, 238, 1); }
    .frame-rgb { border: 4px solid #f43f5e; animation: rgbPulse 2.4s infinite linear; }

    .xp-wallet-box {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.18), rgba(234, 179, 8, 0.1));
      border: 1px solid rgba(251, 191, 36, 0.45);
      border-radius: 16px;
      padding: 14px 20px;
      text-align: right;
    }

    .shop-controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .shop-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .shop-tab {
      padding: 9px 15px;
      border-radius: 12px;
      border: 1px solid var(--solid-border);
      background: var(--solid-panel);
      color: var(--text-muted);
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .shop-tab.active {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-color: #fbbf24;
      color: #0f172a;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 14px;
    }
    .shop-item-card {
      background: var(--solid-panel);
      border: 1px solid var(--solid-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      position: relative;
      transition: transform 0.2s ease;
    }
    .shop-item-card:hover {
      transform: translateY(-3px);
    }
    .shop-item-card.equipped {
      border-color: #34d399;
      box-shadow: 0 0 0 1px rgba(52, 211, 153, 0.35);
    }

    .rarity-pill {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 0.65rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: 999px;
      z-index: 2;
    }
    .rar-comune { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.35); }
    .rar-raro { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
    .rar-epico { background: rgba(168, 85, 247, 0.22); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.45); }
    .rar-leggendario { background: rgba(251, 191, 36, 0.22); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.5); }
    .rar-mitico { background: linear-gradient(135deg, rgba(244, 63, 94, 0.28), rgba(34, 211, 238, 0.28)); color: #f472b6; border: 1px solid rgba(244, 114, 182, 0.55); }

    .item-preview-area {
      height: 86px;
      border-radius: 12px;
      background: var(--solid-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      padding: 0 10px;
      text-align: center;
    }

    .btn-shop-buy {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #2563eb, #0284c7);
      color: #fff;
      font-weight: 800;
      font-size: 0.84rem;
      cursor: pointer;
    }
    .btn-shop-equip {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #38bdf8;
      background: rgba(56, 189, 248, 0.16);
      color: #38bdf8;
      font-weight: 800;
      font-size: 0.84rem;
      cursor: pointer;
    }
    .btn-shop-equipped {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #34d399;
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
      font-weight: 900;
      font-size: 0.84rem;
      cursor: default;
    }

    @media (max-width: 780px) {
      #repXpAdminCard > div:nth-child(2) {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>

      const saved = Array.isArray(userData.shopOwned) ? userData.shopOwned : [];
      return Array.from(new Set([...base, ...saved]));

      const initial = name.charAt(0).toUpperCase();
      const photoUrl = userData.photoURL || currentUser?.photoURL || "";
      const eq = getEquipped();
      const owned = getOwnedIds();

      const frameObj = SHOP_ITEMS.find(i => i.id === eq.frame) || SHOP_ITEMS[0];
      const titleObj = SHOP_ITEMS.find(i => i.id === eq.title) || SHOP_ITEMS.find(i => i.id === "title-base");
      const badgeObj = SHOP_ITEMS.find(i => i.id === eq.badge) || SHOP_ITEMS.find(i => i.id === "badge-base");

      const ring = document.getElementById("previewAvatarRing");
      if (photoUrl) {
        ring.innerHTML = `<img src="${photoUrl}" alt="${name}" referrerpolicy="no-referrer" />`;
      } else {
        ring.textContent = initial;
      }
      ring.className = `custom-avatar-ring ${frameObj.cssClass}`;

      document.getElementById("previewFullName").textContent = name;
      document.getElementById("previewTitlePill").textContent = titleObj.label;
      document.getElementById("previewBadgeIcon").textContent = badgeObj.icon;
      document.getElementById("userXpBalance").textContent = `${getUserXp()} XP`;
      document.getElementById("ownedCounterText").textContent = `Collezione sbloccata: ${owned.length} / ${SHOP_ITEMS.length} oggetti`;
    }

    function renderShop() {
      const grid = document.getElementById("shopGrid");
      const owned = getOwnedIds();
      const eq = getEquipped();
      const xp = getUserXp();

      const filtered = SHOP_ITEMS.filter(item => {
        const matchCat = currentCat === "all" || item.type === currentCat;
        const matchRar = currentRarity === "all" || item.rarity === currentRarity;
        return matchCat && matchRar;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="color:var(--text-muted); grid-column:1/-1; text-align:center; padding:24px;">Nessun oggetto trovato con questo filtro.</p>`;
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const isOwned = owned.includes(item.id);
        const isEq = (item.type === "frame" && eq.frame === item.id) ||
                     (item.type === "title" && eq.title === item.id) ||
                     (item.type === "badge" && eq.badge === item.id);

        let previewHtml = "";
        if (item.type === "frame") {
          previewHtml = `<div class="custom-avatar-ring ${item.cssClass}" style="width:56px;height:56px;font-size:1.2rem;">1BI</div>`;
        } else if (item.type === "title") {
          previewHtml = `<span style="padding:5px 12px; border-radius:999px; background:rgba(56,189,248,0.18); color:#38bdf8; font-size:0.82rem;">${item.label}</span>`;
        } else {
          previewHtml = `<span style="font-size:2.4rem;">${item.icon}</span>`;
        }

        let btnHtml = "";
        if (isEq) {
          btnHtml = `<button type="button" class="btn-shop-equipped">✓ Equipaggiato</button>`;
        } else if (isOwned) {
          btnHtml = `<button type="button" class="btn-shop-equip" data-equip-id="${item.id}">Equipaggia</button>`;
        } else {
          btnHtml = `<button type="button" class="btn-shop-buy" data-buy-id="${item.id}">Sblocca per ${item.price} XP</button>`;
        }

        return `
          <div class="shop-item-card ${isEq ? "equipped" : ""}">
            <span class="rarity-pill rar-${item.rarity}">${RARITY_LABELS[item.rarity] || item.rarity}</span>
            <div>
              <div class="item-preview-area">${previewHtml}</div>
              <div style="font-weight:800; font-size:0.95rem; margin-top:12px;">${item.name}</div>
              <div style="font-size:0.78rem; color:var(--text-muted); margin-top:4px;">${item.desc}</div>
            </div>
            <div>${btnHtml}</div>
          </div>
        `;
      }).join("");

      grid.querySelectorAll("[data-buy-id]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const item = SHOP_ITEMS.find(i => i.id === btn.dataset.buyId);
          if (!item || !currentUser) return;
          if (xp < item.price) {
            return alert(`Ti servono ${item.price} XP (hai ${xp} XP). Completa interrogazioni AI o attività per guadagnarne altri!`);
          }
          const newXp = xp - item.price;
          const newOwned = Array.from(new Set([...owned, item.id]));
          const updateObj = {
            xp: newXp,
            punti: newXp,
            shopOwned: newOwned
          };
          if (item.type === "frame") updateObj.equippedFrame = item.id;
          if (item.type === "title") updateObj.equippedTitle = item.id;
          if (item.type === "badge") updateObj.equippedBadge = item.id;

          await updateDoc(doc(db, "utenti_registrati", currentUser.uid), updateObj);
        });
      });

      grid.querySelectorAll("[data-equip-id]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const item = SHOP_ITEMS.find(i => i.id === btn.dataset.equipId);
          if (!item || !currentUser) return;
          const updateObj = {};
          if (item.type === "frame") updateObj.equippedFrame = item.id;
          if (item.type === "title") updateObj.equippedTitle = item.id;
          if (item.type === "badge") updateObj.equippedBadge = item.id;
          await updateDoc(doc(db, "utenti_registrati", currentUser.uid), updateObj);
        });
      });
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) return;
      currentUser = user;

      mountRepXpAdminPanel(document.getElementById("shopMainContainer"), user);

      onSnapshot(doc(db, "utenti_registrati", user.uid), (snap) => {
        userData = snap.exists() ? snap.data() : {};
        updateShowcase();
        renderShop();
      });
    });
  </script>
</body>
</html>
